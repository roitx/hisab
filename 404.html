<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F172A">
<title>404 – Page nahi mila | Aasaan Hisaab</title>
<meta name="description" content="Yeh page maujood nahi hai. Aasaan Hisaab ke home page par jaayein.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#030712;--card:rgba(30,41,59,.7);--line:rgba(255,255,255,.12);--green:#10B981;--violet:#8B5CF6;--text:#F8FAFC;--muted:#94A3B8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
    background:radial-gradient(800px 460px at 50% -10%,rgba(139,92,246,.25),transparent 60%),radial-gradient(600px 380px at 90% 110%,rgba(16,185,129,.18),transparent 60%),var(--bg)}
  .breadcrumb{width:100%;max-width:420px;font-size:.78rem;color:var(--muted)}
  .breadcrumb ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .breadcrumb li+li::before{content:"›";margin-right:6px}
  .breadcrumb a{color:var(--green);text-decoration:none}
  .breadcrumb a:hover{text-decoration:underline}
  .breadcrumb [aria-current="page"]{color:var(--text)}
  .card{width:100%;max-width:420px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 24px;box-shadow:0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(14px)}
  .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
  .code{font-size:64px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--green),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-size:1.25rem;margin:10px 0 8px}
  p{font-size:.9rem;line-height:1.7;color:var(--muted);margin-bottom:20px}
  .btn{display:block;width:100%;padding:14px 18px;border-radius:14px;font-weight:800;font-size:1rem;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,#8B5CF6,#6D28D9);box-shadow:0 6px 18px rgba(139,92,246,.35)}
  .btn:active{transform:scale(.98)}
  .btn+.btn{margin-top:10px}
  .btn.alt{background:linear-gradient(135deg,#F5B83D,#D99A1E);color:#111827;box-shadow:0 6px 18px rgba(245,184,61,.3)}
  .small{margin-top:16px;font-size:.82rem;color:var(--muted);line-height:1.6;margin-bottom:0}
  .small b{color:var(--text)}
  .link{background:none;border:0;color:var(--green);font-size:.82rem;text-decoration:underline;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    <li><a href="/">Home</a></li>
    <li aria-current="page">404 Page Not Found</li>
  </ol>
</nav>
<main class="card">
  <img class="logo" src="/icon-512.png" alt="Aasaan Hisaab logo" width="72" height="72">
  <div class="code" aria-hidden="true">404</div>
  <h1>Yeh page nahi mila</h1>
  <p>Hamari main site ab naye domain par shift ho gayi hai. Neeche se woh site chuniye jahan aapko jaana hai.</p>
  <a class="btn" id="newBtn" href="https://roitx.dpdns.org/index.html">PM Roitx  par jaayein</a>
  <a class="btn alt" id="homeBtn" href="https://roitx.qd.je/">Aasaan Hisaab par jaayein</a>
  <p class="small" id="status">Koi option na chunne par <b id="secs">5</b> second me aap apne aap <b>roitx.qd.je</b> par pahunch jaayenge.</p>
  <button class="link" id="pauseBtn" type="button">Ruko, redirect band karo</button>
</main>
<noscript><meta http-equiv="refresh" content="5;url=https://roitx.qd.je/"></noscript>
<script>
(function () {
  var DEFAULT_URL = 'https://roitx.qd.je/';
  var NEW_HOST = 'roitx.dpdns.org';
  var left = 5, paused = false;

  // Naye site ke button par purana path/query same rakho (purane PM Roitx links ke liye)
  var path = location.pathname.replace(/\/index\.html$/, '/') || '/';
  // Saath me ?from=roitx-qd jodte hain taaki PM Roitx ka 404 page pyara welcome message dikha sake
  var q = new URLSearchParams(location.search);
  q.set('from', 'roitx-qd');
  document.getElementById('newBtn').href = 'https://' + NEW_HOST + path + '?' + q.toString() + location.hash;

  var secsEl = document.getElementById('secs');
  var timer = setInterval(function () {
    if (paused) return;
    left--;
    if (left <= 0) { clearInterval(timer); location.replace(DEFAULT_URL); return; }
    secsEl.textContent = left;
  }, 1000);

  document.getElementById('pauseBtn').addEventListener('click', function () {
    paused = !paused;
    this.textContent = paused ? 'Redirect dobara chalu karo' : 'Ruko, redirect band karo';
    document.getElementById('status').innerHTML = paused
      ? 'Redirect ruka hua hai. Upar se apna site chuniye.'
      : 'Koi option na chunne par <b id="secs">' + left + '</b> second me aap apne aap <b>roitx.qd.je</b> par pahunch jaayenge.';
    secsEl = document.getElementById('secs');
  });
})();
</script>
</body>
</html>
